[package]
name = "voyager"
version = "0.9.6"
edition = "2021"
publish = false

[dependencies]
askama = { version = "0.12.1", features = ["with-axum"] }
askama_axum = "0.4.0"
axum = "0.7.5"
axum-login = "0.15.3"
base64 = "0.22.1"
bincode = "1.3.3"
bitvec = "1.0.1"
dashmap = { version = "6.0.1", features = ["serde"] }
derive_more = { version = "1.0.0-beta.6", features = ["display", "from_str"] }
image = "0.25.1"
inquire = "0.7.5"
itertools = "0.13.0"
nom = "7.1.3"
notify-debouncer-mini = "0.4.1"
parking_lot = "0.12.3"
password-auth = "1.1.0-pre.0"
ron = "0.8.1"
rustrict = "0.7.25"
serde = { version = "1.0.203", features = ["derive"] }
strum = "0.26.3"
strum_macros = "0.26.4"
thiserror = "1.0.61"
time = "0.3.36"
tokio = { version = "1.38.0", features = ["rt-multi-thread", "signal"] }
tower-http = { version = "0.5.2", features = ["timeout"] }
tracing = "0.1.40"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.18"
ulid = { version = "1.1.2", features = ["serde"] }
unicode-segmentation = "1.11.0"
ureq = { version = "2.9.7", features = ["json"] }

[dev-dependencies]
axum-test = "15.2.0"
pretty_assertions = "1.4.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
missing_docs_in_private_items = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
