[package]
name = "voyager"
version = "0.8.2"
edition = "2021"
publish = false

[dependencies]
askama = { version = "0.12.1", features = ["with-axum"] }
askama_axum = "0.4.0"
axum = "0.7.5"
axum-login = "0.15.1"
base64 = "0.22.1"
bincode = "1.3.3"
bitvec = "1.0.1"
dashmap = { version = "5.5.3", features = ["serde"] }
derive_more = { version = "1.0.0-beta.6", features = ["display"] }
image = "0.25.1"
inquire = "0.7.5"
itertools = "0.12.1"
notify-debouncer-mini = "0.4.1"
parking_lot = "0.12.2"
password-auth = "1.1.0-pre.0"
ron = "0.8.1"
serde = { version = "1.0.201", features = ["derive"] }
thiserror = "1.0.60"
time = "0.3.36"
tokio = { version = "1.37.0", features = ["rt-multi-thread", "signal"] }
tower-http = { version = "0.5.2", features = ["timeout"] }
tracing = "0.1.40"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.18"
ulid = { version = "1.1.2", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4.0"
axum-test = "14.2.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
missing_docs_in_private_items = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
