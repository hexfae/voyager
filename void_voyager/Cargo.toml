[package]
name = "void_voyager"
version = "1.0.0-alpha.0"
edition = "2024"
publish = false
description = "The server back-end for Endless Void"
repository = "https://github.com/hexfae/voyager"

[[bin]]
name = "void_voyager"
path = "./main.rs"

[dependencies]
axum = "0.8.1"
bincode = "1.3.3" # TODO: update to 2.0.0
dashmap = { version = "7.0.0-rc1", features = ["serde"] } # TODO: update when released
miette = { version = "7.5.0", features = ["fancy"] }
ron = "0.8.1"
serde = { version = "1.0.218", features = ["derive"] }
snafu = "0.8.5"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros"]}
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.19"
ulid = "1.2.0"
void_codex = { path = "../void_codex" }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
# missing_docs = "warn"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
# missing_docs_in_private_items = "warn" # TODO: uncomment
missing_errors_doc = "allow" # TODO: remove
