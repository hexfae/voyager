[package]
name = "void_codex"
version = "0.9.6"
edition = "2021"
publish = false

[lib]
path = "./lib.rs"

[dependencies]
axum = "0.7.5"
base64 = "0.22.1"
bitvec = "1.0.1"
derive_more = { version = "1.0.0-beta.6", features = ["display", "from_str"] }
image = "0.25.1"
itertools = "0.13.0"
nom = "7.1.3"
serde = { version = "1.0.203", features = ["derive"] }
strum = "0.26.3"
strum_macros = "0.26.4"
thiserror = "1.0.61"
time = "0.3.36"
tracing = "0.1.40"
ulid = { version = "1.1.2", features = ["serde"] }
unicode-segmentation = "1.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
missing_docs_in_private_items = "warn"

