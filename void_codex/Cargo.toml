[package]
name = "void_codex"
version = "1.0.0-alpha.0"
edition = "2024"
publish = false

[lib]
path = "./lib.rs"

[dependencies]
axum = "0.8.1"
base64 = "0.22.1"
bitvec = "1.0.1"
derive_more = { version = "2.0.1", features = ["display"] }
image = "0.25.5"
itertools = "0.14.0"
miette = "7.5.0"
nom = "7.1.3" # TODO: update to 8.0.0
serde = { version = "1.0.218", features = ["derive"] }
snafu = "0.8.5"
thiserror = "2.0.12"
time = "0.3.37"
tracing = "0.1.41"
ulid = { version = "1.2.0", features = ["serde"] }
unicode-segmentation = "1.12.0"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
# missing_docs = "warn"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
# missing_docs_in_private_items = "warn"
missing_errors_doc = "allow" # TODO: remove

